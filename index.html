<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Avanzado</title>
    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Precarga de fuentes de Google Fonts para mejorar rendimiento -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Enlace a la fuente Share Tech Mono de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Contenedor principal de la aplicación -->
    <div class="container">
        <!-- Sección del reloj principal -->
        <div class="reloj-principal">
            <p class="fecha"></p> <!-- Elemento para mostrar la fecha -->
            <p class="tiempo"></p> <!-- Elemento para mostrar la hora -->
        </div>

        <!-- Contenedor para todos los controles -->
        <div class="controles">
            <!-- Sección de Alarma -->
            <fieldset class="control-seccion">
                <legend>Alarma</legend> <!-- Título de la sección -->
                <!-- Input para seleccionar la hora de la alarma -->
                <input type="time" id="alarmTime" title="Establecer hora de alarma">
                <!-- Input para el mensaje de la alarma (opcional) -->
                <input type="text" id="alarmMessage" placeholder="Mensaje (opcional)">
                <!-- Botón para establecer la alarma -->
                <button id="setAlarmBtn">Establecer Alarma</button>
                <!-- Lista donde se mostrarán las alarmas activas -->
                <div id="alarmList">
                    <h4>Alarmas Activas:</h4>
                    <ul></ul>
                </div>
            </fieldset>

            <!-- Sección de Personalización de Colores -->
            <fieldset class="control-seccion">
                <legend>Colores</legend> <!-- Título de la sección -->
                <div>
                    <label for="textColor">Color Texto:</label>
                    <input type="color" id="textColor" value="#FFFFFF"> <!-- Selector de color para el texto -->
                </div>
                <div>
                    <label for="bgColor1">Fondo (Inicio Grad.):</label>
                    <input type="color" id="bgColor1" value="#0000FF"> <!-- Selector de color para inicio del gradiente de fondo -->
                </div>
                <div>
                    <label for="bgColor2">Fondo (Fin Grad.):</label>
                    <input type="color" id="bgColor2" value="#000000"> <!-- Selector de color para fin del gradiente de fondo -->
                </div>
                <div>
                    <label for="glowColor1">Brillo Texto 1:</label>
                    <input type="color" id="glowColor1" value="#E6AB0A"> <!-- Selector de color para el primer brillo del texto -->
                </div>
                <div>
                    <label for="glowColor2">Brillo Texto 2:</label>
                    <input type="color" id="glowColor2" value="#FFFF16"> <!-- Selector de color para el segundo brillo del texto -->
                </div>
            </fieldset>

            <!-- Sección de Zonas Horarias Adicionales -->
            <fieldset class="control-seccion">
                <legend>Zonas Horarias Adicionales</legend> <!-- Título de la sección -->
                <!-- Selector para elegir una zona horaria -->
                <select id="timeZoneSelect">
                    <option value="">Seleccionar zona horaria...</option>
                    <option value="America/New_York">Nueva York</option>
                    <option value="Europe/London">Londres</option>
                    <option value="Asia/Tokyo">Tokio</option>
                    <option value="Australia/Sydney">Sydney</option>
                    <option value="Europe/Paris">París</option>
                    <option value="America/Los_Angeles">Los Ángeles</option>
                </select>
                <!-- Botón para añadir el reloj de la zona horaria seleccionada -->
                <button id="addTimeZoneBtn">Añadir Reloj</button>
                <!-- Contenedor donde se insertarán los relojes adicionales -->
                <div id="additionalClocksContainer">
                </div>
            </fieldset>
            <!-- La sección de Formato Fecha/Hora ha sido eliminada -->
        </div>
    </div>

    <!-- Enlace al archivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
