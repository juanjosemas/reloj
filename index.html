<!-- La declaración del tipo de documento, siempre al principio. -->
<!DOCTYPE html>
<!-- Etiqueta raíz del documento, con el idioma en español. -->
<html lang="es">
<head>
    <!-- Metadatos esenciales para el navegador -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- El viewport es crucial para que el diseño se adapte a dispositivos móviles. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Avanzado</title>

    <!-- Enlaces a recursos externos -->
    <!-- Hoja de estilos principal -->
    <link rel="stylesheet" href="style.css">
    <!-- Precarga de las fuentes de Google para un rendimiento óptimo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Enlace a la fuente específica que usamos: Share Tech Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<!-- El body tiene un data-attribute que nos ayudará a saber en qué modo estamos (Reloj, Crono, etc.) -->
<body data-mode="clock">

    <!-- Contenedor principal que organiza la barra lateral y el contenido principal. -->
    <div class="app-container">
        <!-- Barra lateral para los relojes del mundo (oculta por defecto en móviles). -->
        <aside class="world-clocks-sidebar"></aside>

        <!-- Contenido principal que alberga los diferentes modos. -->
        <main class="main-display-container">
            <!-- Barra de navegación para cambiar entre los modos de la aplicación. -->
            <nav class="mode-nav">
                <button class="mode-btn active" data-mode="clock">Reloj</button>
                <button class="mode-btn" data-mode="stopwatch">Cronómetro</button>
                <button class="mode-btn" data-mode="timer">Temporizador</button>
            </nav>

            <!-- Contenedor para la vista del Reloj Principal. -->
            <div class="mode-view clock-view">
                <div class="reloj-principal">
                    <p class="fecha"></p>
                    <p class="tiempo"></p>
                    <div class="weather-container">
                        <img src="" alt="Icono del tiempo" class="weather-icon">
                        <span class="weather-temp"></span>
                        <span class="weather-city"></span>
                    </div>
                </div>
            </div>

            <!-- Contenedor para la vista del Cronómetro. -->
            <div class="mode-view stopwatch-view">
                <p class="stopwatch-time">00:00.00</p>
                <div class="stopwatch-controls">
                    <button id="startStopwatchBtn">Iniciar</button>
                    <button id="lapBtn" disabled>Vuelta</button>
                    <button id="resetStopwatchBtn" disabled>Reiniciar</button>
                </div>
                <ul class="laps-list"></ul>
            </div>

            <!-- Contenedor para la vista del Temporizador. -->
            <div class="mode-view timer-view">
                <div class="timer-inputs">
                    <input type="number" id="timerMinutes" min="0" max="99" value="5" placeholder="MM">
                    <span>:</span>
                    <input type="number" id="timerSeconds" min="0" max="59" value="0" placeholder="SS">
                </div>
                <p class="timer-countdown">05:00</p>
                <div class="timer-controls">
                    <button id="startTimerBtn">Iniciar</button>
                    <button id="stopTimerBtn" disabled>Parar</button>
                    <button id="resetTimerBtn" disabled>Reiniciar</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Panel de Controles deslizable (oculto por defecto). -->
    <div class="controles-container">
        <!-- Cada fieldset agrupa un tipo de configuración. -->
        <fieldset class="control-seccion">
            <legend>Alarma</legend>
            <input type="time" id="alarmTime">
            <input type="text" id="alarmMessage" placeholder="Mensaje (opcional)">
            <button id="setAlarmBtn">Establecer Alarma</button>
            <div id="alarmList"><h4>Alarmas Activas:</h4><ul></ul></div>
        </fieldset>
        <fieldset class="control-seccion">
            <legend>Colores</legend>
            <div><label for="textColor">Texto:</label><input type="color" id="textColor"></div>
            <div><label for="bgColor1">Fondo 1:</label><input type="color" id="bgColor1"></div>
            <div><label for="bgColor2">Fondo 2:</label><input type="color" id="bgColor2"></div>
            <div><label for="glowColor1">Brillo:</label><input type="color" id="glowColor1"></div>
            <div class="theme-buttons">
                <button class="theme-btn" data-theme="neon-classic">Neón Clásico</button>
                <button class="theme-btn" data-theme="ocean">Océano</button>
                <button class="theme-btn" data-theme="sunset">Atardecer</button>
                <button class="theme-btn" data-theme="matrix">Matrix</button>
            </div>
        </fieldset>
        <fieldset class="control-seccion">
            <legend>Ubicación del Clima</legend>
            <div class="location-input-group">
                <input type="text" id="locationInput" placeholder="Ej: Madrid, ES">
                <button id="geolocateBtn" title="Usar mi ubicación actual">📍</button>
            </div>
            <button id="searchWeatherBtn">Buscar Ciudad</button>
        </fieldset>
        <fieldset class="control-seccion">
            <legend>Zonas Horarias</legend>
            <select id="timeZoneSelect"><option value="">Seleccionar zona...</option><option value="America/New_York">Nueva York</option><option value="Europe/London">Londres</option><option value="Asia/Tokyo">Tokio</option></select>
            <button id="addTimeZoneBtn">Añadir Reloj</button>
            <div id="additionalClocksContainer"></div>
        </fieldset>
    </div>

    <!-- Botón flotante para mostrar/ocultar los controles. -->
    <button id="toggleControlsBtn" title="Mostrar/Ocultar Controles">⚙️</button>

    <!-- Diálogo de Alarma personalizado (oculto por defecto). -->
    <div id="alarmDialogOverlay" class="dialog-overlay">
        <div class="dialog-box">
            <h3>¡Alarma!</h3>
            <p id="dialogMessage"></p>
            <div class="dialog-buttons">
                <button id="snoozeBtn">Posponer (5 min)</button>
                <button id="stopAlarmBtn">Detener</button>
            </div>
        </div>
    </div>

    <!-- Enlace final al archivo JavaScript. -->
    <script src="script.js"></script>
</body>
</html>
